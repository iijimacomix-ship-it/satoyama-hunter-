(()=>{'use strict';const c=document.getElementById('game'),g=c.getContext('2d');let W=0,H=0,dpr=1;function resize(){W=document.getElementById('screen').clientWidth;H=document.getElementById('screen').clientHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const $=id=>document.getElementById(id),world={w:1500,h:1700},base={x:520,y:555};let running=false,money=0,meat=0,stock=0,bag=84,lvl=1,kills=0,attackAt=0,tipUntil=0,tipText='',now=0,last=0,flash=[],boars=[],trees=[],flowers=[],dust=[];let customers=[],nextCustomer=0,saleAt=0,customerId=0;const decor=[];let hp=3, invuln=0,combo=0,comboTime=0,shake=0,depositTimer=0,gameTime=0,particles=[],rings=[],fever=0,hitPulse=0;const p={x:550,y:780,face:1,walk:0,attackAnim:0,attackDir:0};const rng=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let keys={},stick={x:0,y:0},startStamp=0;function makeWorld(){for(let i=0;i<205;i++){let x=rng(55,world.w-60),y=rng(55,world.h-60);if(Math.abs(x-base.x)<225&&Math.abs(y-base.y)<210)continue;trees.push({x,y,r:rng(24,39),type:Math.random()<.7?0:1});}for(let i=0;i<230;i++)flowers.push({x:rng(0,world.w),y:rng(0,world.h),tone:Math.random()});for(let i=0;i<420;i++){let x=rng(20,world.w-20),y=rng(20,world.h-20);decor.push({x,y,t:Math.random(),sz:rng(2,7)});}for(let i=0;i<44;i++)spawnBoar();}function insidePen(x,y,pad=0){return x>base.x-188-pad&&x<base.x+177+pad&&y>base.y-170-pad&&y<base.y+140+pad;}function fenceOut(b,ox,oy){if(!insidePen(b.x,b.y,17))return;let L=Math.abs(b.x-(base.x-205)),R=Math.abs(b.x-(base.x+194)),T=Math.abs(b.y-(base.y-187)),B=Math.abs(b.y-(base.y+157));let m=Math.min(L,R,T,B);if(m===L)b.x=base.x-206;else if(m===R)b.x=base.x+195;else if(m===T)b.y=base.y-188;else b.y=base.y+158;b.dir=Math.atan2(b.y-oy,b.x-ox);b.mode="roam";b.cooldown=1.5;}function spawnBoar(){let x,y;do{x=clamp(p.x+rng(-470,470), // 武器の振り下ろし: 狙った動物の方向へ斧を大きく振る

rounded(3,-4,17,8,4,'#c59b74');

if(swinging&&phase>.18&&phase<.82){g.save();g.strokeStyle='rgba(249,234,164,'+(0.82*Math.sin(Math.PI*(phase-.18)/.64))+')';g.lineWidth=11;g.lineCap='round';g.beginPath();g.arc(p.x,p.y-7,57,aim-1.0,aim+0.85);g.stroke();g.restore();}
